# omabox (#324): one binary, built into build/omabox by install.sh and the suite; bin/omabox is a
# link to it (a package installs it at bin/omabox).
[workspace]
members = ["crates/omabox"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"

[profile.release]
lto = "thin"
strip = true
