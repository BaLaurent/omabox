name: CI

on:
  push:
    branches: [main, port-rust]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The version the scripts are kept clean with; Ubuntu's package is older.
      - name: Install shellcheck 0.11.0
        run: |
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz | tar -xJ
          sudo install shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          shellcheck --version
      # Every shell script but spike/ (the original record, superseded by the CLI) and the test oracle
      # (bash's omabox as it was at the switch to the binary, #324: not maintained).
      - name: shellcheck
        run: shellcheck install.sh release.sh docs/demo.sh test/run.sh share/*.sh share/bin/* $(grep -l "^#!" share/guard/*)

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # omabox's binary (#324): formatted, lint-clean, the release build install.sh and a package
      # make, then its own tests. The build comes before the tests, so a failing test still shows
      # whether the release builds.
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo build --release
        run: cargo build --release --locked
      - name: cargo test
        run: cargo test --locked
