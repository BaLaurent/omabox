# omabox (finding 401): no realtime scheduling for PipeWire clients in a box, where none can be had (no
# system bus, so no RealtimeKit; no RLIMIT_RTPRIO). Left on, module-rt takes the Realtime portal's
# RTTimeUSecMax of 0 (the portal reaches no RealtimeKit either) and sets RLIMIT_RTTIME to 0 on the
# client, the Omarchy shell among them; the kernel then SIGKILLs it the first time one of its threads
# runs at a realtime priority, even boosted for a moment by RCU priority boosting under load.
context.properties = {
    module.rt = false
}
