# omabox `up --audio` (#226): the box's only audio devices. Written into the box HOME's
# ~/.config/pipewire/pipewire.conf.d/ at each start (share/session.sh).
# omabox-speaker: a null sink, the default output; what plays there is heard by nobody, and read from
# its monitor (omabox-speaker.monitor) by `record --audio` and `omabox audio`.
# omabox-mic: a silent microphone, the default input, for apps that want one.
context.objects = [
  { factory = adapter
    args = {
      factory.name     = support.null-audio-sink
      node.name        = omabox-speaker
      node.description = "omabox speaker (heard by nobody)"
      media.class      = Audio/Sink
      audio.position   = [ FL FR ]
      priority.session = 2000
      monitor.channel-volumes = true
    }
  }
  { factory = adapter
    args = {
      factory.name     = support.null-audio-sink
      node.name        = omabox-mic
      node.description = "omabox microphone (silent)"
      media.class      = Audio/Source/Virtual
      audio.position   = [ FL FR ]
      priority.session = 2000
    }
  }
]
