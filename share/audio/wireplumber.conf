# omabox `up --audio` (#226): no device monitors in a box. It has no /dev/snd, no system bus (bluez)
# and no cameras; with these off WirePlumber opens no device even should one show up.
wireplumber.profiles = {
  main = {
    monitor.alsa = disabled
    monitor.alsa-midi = disabled
    monitor.bluez = disabled
    monitor.bluez-midi = disabled
    monitor.v4l2 = disabled
    monitor.libcamera = disabled
  }
}
